AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cognito-protected public edge for the Quantify single-agent verification contract.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI for the public agent boundary.
    AllowedPattern: ^.+@sha256:[0-9a-f]{64}$
  CoreApiId:
    Type: String
    Description: API ID of the separate IAM-private Quantify production core.
  CoreStageName:
    Type: String
    Default: production
    AllowedPattern: ^[A-Za-z0-9_-]{1,128}$
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique, lower-case Cognito hosted-domain prefix.
    AllowedPattern: ^[a-z][a-z0-9-]{0,61}[a-z0-9]$
  OAuthResourceServerIdentifier:
    Type: String
    Description: Stable URI identifier for the public Quantify agent OAuth scope.
    AllowedPattern: ^https://.+$
  AlarmEmail:
    Type: String
    Description: Email recipient for public-edge operational alarms.
  ApiThrottleRateLimit:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  ApiThrottleBurstLimit:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  BrowserClientId:
    Type: String
    Default: ""
    Description: Optional no-secret Cognito PKCE browser client ID created by the private web-preview stack.
    AllowedPattern: ^$|^[A-Za-z0-9_-]{1,128}$
  TrialEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Enables only the temporary anonymous trial route; false fails closed.
  TrialExpiresAt:
    Type: String
    Default: ""
    Description: UTC ISO-8601 expiry for the anonymous trial.
    AllowedPattern: ^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  TrialIpHashKey:
    Type: String
    Default: ""
    NoEcho: true
    MaxLength: 256
    Description: Secret HMAC key used only to avoid storing raw trial IP addresses.
  TrialOriginKey:
    Type: String
    Default: ""
    NoEcho: true
    MaxLength: 256
    Description: Secret CloudFront-to-origin header required by the anonymous trial route.
  TrialPerIpDailyLimit:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
  TrialDailyRequestLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
  TrialDailyCostLimitMicroUsd:
    Type: Number
    Default: 250000
    MinValue: 1
    MaxValue: 10000000
  TrialRequestCostReservationMicroUsd:
    Type: Number
    Default: 2500
    MinValue: 1
    MaxValue: 100000

Conditions:
  HasBrowserClient: !Not [!Equals [!Ref BrowserClientId, ""]]

Resources:
  PublicAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-public-agent
      RetentionInDays: 30

  PublicApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-public-agent
      RetentionInDays: 30

  PublicApiAccessLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-public-api-access-log-delivery
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${PublicApiAccessLogGroup}:log-stream:*

  PublicAgentUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-public-agent
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: "OFF"
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

  PublicAgentResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref PublicAgentUserPool
      Identifier: !Ref OAuthResourceServerIdentifier
      Name: quantify-agent
      Scopes:
        - ScopeName: verify
          ScopeDescription: Submit one bounded company-analysis verification request.

  PublicAgentUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref PublicAgentUserPool

  PublicAgentMachineClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: PublicAgentResourceServer
    Properties:
      ClientName: !Sub ${AWS::StackName}-machine-client
      UserPoolId: !Ref PublicAgentUserPool
      GenerateSecret: true
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - !Sub ${OAuthResourceServerIdentifier}/verify

  PublicAgentApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: production
      FailOnWarnings: true
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${PublicAgentUserPool}
              audience:
                - !Ref PublicAgentMachineClient
                - !If [HasBrowserClient, !Ref BrowserClientId, !Ref AWS::NoValue]
            AuthorizationScopes:
              - !Sub ${OAuthResourceServerIdentifier}/verify
      AccessLogSettings:
        DestinationArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${PublicApiAccessLogGroup}
        Format: '{"requestId":"$context.requestId","status":"$context.status","routeKey":"$context.routeKey","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit

  PublicAgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOnlyPublicAgentLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: InvokeOnlyPrivateQuantifyCore
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: execute-api:Invoke
                Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApiId}/${CoreStageName}/POST/v1/companies/*/verify
        - PolicyName: ReserveAnonymousTrialCapacity
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt AnonymousTrialLedger.Arn
                  - !Sub ${AnonymousTrialLedger.Arn}/index/*

  AnonymousTrialLedger:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-anonymous-trial-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bucket
          AttributeType: S
      KeySchema:
        - AttributeName: bucket
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  PublicAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-public-agent
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - quantify.agent_lambda.handler
      Role: !GetAtt PublicAgentExecutionRole.Arn
      Timeout: 10
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref PublicAgentLogGroup
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Environment:
        Variables:
          QUANTIFY_CORE_URL: !Sub https://${CoreApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${CoreStageName}
          QUANTIFY_TRIAL_ENABLED: !Ref TrialEnabled
          QUANTIFY_TRIAL_LEDGER_TABLE_NAME: !Ref AnonymousTrialLedger
          QUANTIFY_TRIAL_PER_IP_DAILY_LIMIT: !Ref TrialPerIpDailyLimit
          QUANTIFY_TRIAL_DAILY_REQUEST_LIMIT: !Ref TrialDailyRequestLimit
          QUANTIFY_TRIAL_DAILY_COST_LIMIT_MICRO_USD: !Ref TrialDailyCostLimitMicroUsd
          QUANTIFY_TRIAL_REQUEST_COST_RESERVATION_MICRO_USD: !Ref TrialRequestCostReservationMicroUsd
          QUANTIFY_TRIAL_IP_HASH_KEY: !Ref TrialIpHashKey
          QUANTIFY_TRIAL_ORIGIN_KEY: !Ref TrialOriginKey
          QUANTIFY_TRIAL_EXPIRES_AT: !Ref TrialExpiresAt
      Events:
        Verify:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicAgentApi
            Path: /v1/agent/verify
            Method: POST
        TrialVerify:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicAgentApi
            Path: /v1/trial/verify
            Method: POST
            Auth:
              Authorizer: NONE

  PublicAgentAlerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-alerts
      DisplayName: Quantify public agent

  PublicAgentAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref PublicAgentAlerts

  PublicAgentLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-public-agent-errors
      AlarmDescription: Public agent Lambda invocation errors require investigation.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PublicAgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PublicAgentAlerts

  PublicAgentApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-public-agent-api-5xx
      AlarmDescription: Public agent API returned a server error.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref PublicAgentApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PublicAgentAlerts

Outputs:
  PublicAgentUrl:
    Description: Public, Cognito-JWT-protected Quantify agent endpoint.
    Value: !Sub https://${PublicAgentApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/production/v1/agent/verify
  AnonymousTrialUrl:
    Description: Temporary anonymous, fail-closed trial route. Enable explicitly and retire at expiry.
    Value: !Sub https://${PublicAgentApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/production/v1/trial/verify
  PublicAgentApiId:
    Description: API ID used only by the separate CloudFront private-preview origin.
    Value: !Ref PublicAgentApi
  CognitoUserPoolId:
    Description: Cognito user-pool identifier for the public machine client.
    Value: !Ref PublicAgentUserPool
  CognitoMachineClientId:
    Description: Public OAuth machine-client identifier; retrieve its secret separately.
    Value: !Ref PublicAgentMachineClient
  OAuthTokenEndpoint:
    Description: OAuth token endpoint for the Cognito machine client.
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
  PublicAgentFunctionName:
    Value: !Ref PublicAgentFunction
