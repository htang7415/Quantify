AWSTemplateFormatVersion: "2010-09-09"
Description: Private Quantify web-preview delivery with a no-secret Cognito PKCE browser client.

Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Existing Quantify public-agent user pool identifier.
  LocalRedirectUri:
    Type: String
    Default: http://127.0.0.1:5173/
    Description: Exact local development callback URL for the browser client.
    AllowedPattern: ^http://(localhost|127\.0\.0\.1):[0-9]{2,5}/$
  OAuthResourceServerIdentifier:
    Type: String
    Description: Existing Quantify resource-server URI.
    AllowedPattern: ^https://.+$
  PublicAgentApiId:
    Type: String
    Description: Existing scoped public-agent HTTP API ID.

Resources:
  PreviewBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PreviewOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PreviewStaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-static
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  PreviewApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${AWS::StackName}-public-agent
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Authorization
            - Content-Type
        QueryStringsConfig:
          QueryStringBehavior: none

  PreviewStaticResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-static-security
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  PreviewDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: StaticSite
            DomainName: !GetAtt PreviewBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PreviewOriginAccessControl.Id
            S3OriginConfig: {}
          - Id: PublicAgent
            DomainName: !Sub ${PublicAgentApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            OriginPath: /production
            CustomOriginConfig:
              HTTPSPort: 443
              HTTPPort: 80
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: StaticSite
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref PreviewStaticCachePolicy
          ResponseHeadersPolicyId: !Ref PreviewStaticResponseHeadersPolicy
        CacheBehaviors:
          - PathPattern: /v1/agent/verify
            TargetOriginId: PublicAgent
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            # AWS-managed CachingDisabled: no cache key values and all TTLs zero.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref PreviewApiOriginRequestPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  PreviewBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PreviewBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${PreviewBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PreviewDistribution}

  PreviewBrowserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-browser-client
      UserPoolId: !Ref CognitoUserPoolId
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - !Sub ${OAuthResourceServerIdentifier}/verify
      CallbackURLs:
        - !Sub https://${PreviewDistribution.DomainName}/
        - !Ref LocalRedirectUri
      LogoutURLs:
        - !Sub https://${PreviewDistribution.DomainName}/
        - !Ref LocalRedirectUri
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO

Outputs:
  PreviewBucketName:
    Value: !Ref PreviewBucket
  PreviewUrl:
    Value: !Sub https://${PreviewDistribution.DomainName}/
  PreviewDistributionId:
    Value: !Ref PreviewDistribution
  BrowserClientId:
    Description: No-secret browser OAuth client ID accepted by the Quantify public edge after its guarded update.
    Value: !Ref PreviewBrowserClient
