[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantify"
version = "0.1.0"
description = "Evidence-constrained verification for company-analysis claims"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.42.37,<2", "fastapi>=0.115", "pyarrow>=16,<20"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["quantify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
